name: CI - Test & Quality Checks

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run code quality checks
      run: |
        # Check code formatting with black
        black --check src/ tests/

        # Lint with flake8
        flake8 src/ tests/

    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  train-agent:
    name: Train RL Agent (Quick Test)
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate synthetic data
      run: |
        python src/synthetic_data_generator.py

    - name: Quick agent training test (1000 steps)
      run: |
        python -c "
from src.environment import GroceryInventoryEnv
from src.agent import GroceryAgent

env = GroceryInventoryEnv(num_products=5, episode_length=10)
agent = GroceryAgent(env)
print('Training agent for 1000 timesteps (quick CI test)...')
agent.train(total_timesteps=1000)
print('✅ Training completed successfully!')
        "

    - name: Test environment import
      run: |
        python -c "from src.environment import GroceryInventoryEnv; print('✅ Environment OK')"

    - name: Test agent import
      run: |
        python -c "from src.agent import GroceryAgent; print('✅ Agent OK')"

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [test, train-agent]
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && [ "${{ needs.train-agent.result }}" == "success" ]; then
          echo "✅ All checks passed!"
          exit 0
        else
          echo "❌ Some checks failed"
          exit 1
        fi
